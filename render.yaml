services:
  - type: web
    name: compillo-studio
    runtime: node
    plan: free
    region: oregon
    buildCommand: bun install --frozen-lockfile && bun run build
    startCommand: node dist/server.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.22.1
      - key: BUN_VERSION
        value: 1.4.4
      - key: ENABLE_UNSAFE_EXECUTION
        value: "false"
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
